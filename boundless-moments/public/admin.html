<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Reset */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background: linear-gradient(to right, #cbc8ce, #b9bec5);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    color: #333;
  }

  header {
    width: 100%;
    background-color: rgba(0,0,0,0.8);
    color: white;
    padding: 15px 0;
    text-align: center;
    margin-bottom: 40px;
  }

  header h1 {
    font-size: 28px;
    margin-bottom: 10px;
  }

  nav a {
    color: white;
    margin: 0 12px;
    text-decoration: none;
    font-weight: 500;
    transition: 0.3s;
  }

  nav a:hover {
    text-decoration: underline;
  }

  h2 {
    color: white;
    margin-bottom: 20px;
    font-size: 24px;
    text-align: center;
  }

  form {
    background-color: rgba(255,255,255,0.95);
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
  }

  form input {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
  }

  form input:focus {
    border-color: #2575fc;
    box-shadow: 0 0 5px rgba(37,117,252,0.5);
  }

  form button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #0e0e0f;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
  }

  form button:hover {
    background: #533d6a;
  }

  #error {
    text-align: center;
    margin-top: 10px;
    color: red;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 22px; }
    h2 { font-size: 20px; }
    form { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <h1>Admin Login</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="gallery.html">Gallery</a>
    <a href="experience.html">Experience</a>
    <a href="contact.html">Contact</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<h2>Admin Login</h2>

<!-- Admin login form -->
<form id="adminForm">
  <input type="text" name="username" placeholder="Username" required>
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">Login</button>
</form>

<p id="error"></p>

<script>
  const form = document.getElementById('adminForm');
  const errorEl = document.getElementById('error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = ''; // clear previous error

    const formData = new FormData(form);
    const payload = {
      username: formData.get('username'),
      password: formData.get('password')
    };

    try {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.redirected) {
        // If server redirects, follow to dashboard
        window.location.href = res.url;
        return;
      }

      const text = await res.text();
      errorEl.textContent = text; // show error from server

    } catch (err) {
      console.error(err);
      errorEl.textContent = 'Server error. Try again later.';
    }
  });
</script>

</body>
</html>
